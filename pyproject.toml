[project]
name = "openpi"
version = "0.1.0"
description = "Physical Intelligence open source repo"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "augmax>=0.3.4",
    "dm-tree>=0.1.8",
    "einops>=0.8.0",
    "equinox>=0.11.8",
    "etils[epath,epy]>=1.14.0",
    "flatbuffers>=24.3.25",
    "flax==0.10.2",
    "fsspec>=2024.6.0",
    "gcsfs==2026.2.0",
    "imageio>=2.36.1",
    "jax[cuda12]==0.5.3",
    "jaxtyping==0.2.36",
    "lerobot>=0.5,<0.6",
    "ml_collections==1.0.0",
    "numpy>=1.22.4",
    "numpydantic>=1.6.6",
    "opencv-python==4.12.0.88",
    "opencv-python-headless==4.12.0.88",
    "xense-client",
    "orbax-checkpoint==0.11.13",
    "pillow>=11.0.0",
    "sentencepiece>=0.2.0",
    "safetensors>=0.4.3",
    # >=2.6 for `DataLoader(in_order=...)`, which the data loader uses to hand batches
    # over as workers finish them (see TrainConfig.strict_batch_order).
    "torch>=2.6,<2.11.0",
    "torchcodec>=0.2.1,<0.11.0; sys_platform != 'win32' and (sys_platform != 'linux' or (platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'armv7l')) and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
    "torchvision>=0.21.0,<0.26.0",
    "tqdm-loggable>=0.2",
    "typing-extensions>=4.12.2",
    "tyro>=0.9.5",
    "wandb>=0.19.1",
    "filelock>=3.16.1",
    "beartype==0.19.0",
    "treescope>=0.1.7",
    "transformers>=5.5,<5.6",
    "rich>=14.0.0",
    "regex>=2025.10.22",
    "polars>=1.30.0",
    "nvidia-ml-py>=12.0.0",
    "chex",
    "dm_env",
    "pytest",
    "omegaconf>=2.3.0",
]


[project.urls]
Repository = "https://github.com/XenseRobotics-AI/xense-openpi"
Upstream = "https://github.com/Physical-Intelligence/openpi"

[project.optional-dependencies]
# Install with `pip install -e ".[dev]"` etc.
# (Kept in sync with the prior `[dependency-groups]` table that uv-only flows used.)
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.6",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "matplotlib>=3.10.0",
]
rlds = ["dlimp", "tensorflow-cpu>=2.19.0", "tensorflow-datasets>=4.9.9"]

[tool.uv]
override-dependencies = [
    "ml-dtypes==0.4.1",
    "tensorstore==0.1.74",
    "tensorflow>=2.19.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
xense-client = { workspace = true }
dlimp = { git = "https://github.com/kvablack/dlimp", rev = "ad72ce3a9b414db2185bc0b38461d4101a65477a" }

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "docker",
    "third_party",
    # ruff 0.16 reformats python code fences inside Markdown. The architecture
    # notes align their trailing `# comment` columns by hand to be readable as a
    # table; letting the formatter collapse them loses that on every save.
    "*.md",
]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "B",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "FBT",
    "FURB",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PD",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PLR1",
    "PLR5",
    "PLW",
    "PT",
    "Q",
    "RET",
    "RUF",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "UP",
    "W",
]
ignore = [
    "F722",    # Conflicts with array typing.
    "T201",    # We use print statements.
    "PD008",   # Lots of false positives.
    "ISC001",  # Disabling to support ruff format.
    "LOG015",  # Use logger.info.
    "FBT001",  # Boolean-typed positional arguments are common in this codebase.
    "FBT002",  # Boolean default positional arguments are common in this codebase.
    "SLF001",  # Private member access is used intentionally in env wrappers.
    "B905",    # zip() strict= not required here; already in unfixable.
    "RET504",  # Unnecessary assignment before return — readability preference.
    "PLW2901", # for loop variable overwritten — intentional pattern in model code.
    "PERF203", # try/except in loop — intentional in websocket server.
    "B023",    # loop variable binding in lambda — acceptable in internal utilities.
    "SIM108",  # ternary operator suggestion — if/else blocks preferred for readability.
    "F841",    # unused local variable — occasional intentional pattern.
    # Imports inside functions are load-bearing here, not sloppiness: they break the
    # config <-> registry <-> yaml_loader import cycle, and keep optional heavyweights
    # (tensorflow, torch) off the import path of anyone who does not use them.
    "PLC0415",
    # PEP 695 (`type X = ...`, `class C[T]`, `def f[T]()`) builds lazily-evaluated
    # TypeAliasType/type-param objects, and this codebase feeds its annotations to
    # runtime consumers - tyro's CLI generation, jaxtyping+beartype, flax dataclasses.
    # `Filter` in training/config.py already carries a comment about a tyro
    # incompatibility. Keeping the explicit TypeAlias/Generic/TypeVar spellings.
    "UP040",
    "UP046",
    "UP047",
]
unfixable = [
    "B905", # Fix defaults to strict=False, which is not what we want.
]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["collections.abc", "typing", "typing_extensions"]
known-third-party = ["wandb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tests live next to the code they cover (see testpaths below), so hatchling's
# auto-discovery would otherwise ship every `*_test.py` to installing users -
# 16 of the wheel's 70 files before this was added.
[tool.hatch.build.targets.wheel]
exclude = ["**/*_test.py", "**/conftest.py"]

[tool.hatch.build.targets.sdist]
exclude = ["**/*_test.py", "**/conftest.py"]

[tool.pytest.ini_options]
markers = ["manual: should be run manually."]
testpaths = ["src", "scripts", "packages", "examples"]

# Type checking. Pylance (VS Code) and the `pyright` CLI both read this table, so
# the squiggles in the editor and a terminal run can never disagree about a rule -
# the same arrangement [tool.ruff] gives linting. Nothing is duplicated in
# .vscode/settings.json.
[tool.pyright]
include = ["src", "scripts", "examples", "packages"]
exclude = [
    "**/__pycache__",
    "**/.*",
    "docker",
    "third_party",
    # DROID's data pipeline needs tensorflow, tensorflow_datasets, dlimp and the
    # `droid` package - none of them are dependencies of this project. Every
    # symbol in these files resolves to Unknown, so checking them says nothing.
    "examples/droid",
    "src/openpi/training/droid_rlds_dataset.py",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"

# The rules below fire almost exclusively on untyped or partially-typed third
# party code - jax/flax pytrees, torch.Tensor, sentencepiece, the pybind robot
# SDKs - where pyright infers a signature from library source that the library
# does not actually honour at runtime. Left on, they bury the findings that matter
# (undefined names, unbound variables, unresolved imports) under ~500 false ones.
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportAssignmentType = "none"
reportReturnType = "none"
reportOperatorIssue = "none"
reportIndexIssue = "none"
reportIncompatibleMethodOverride = "none"
# `transformers.utils.cached_file`, `websockets.asyncio.server.Request` and friends
# are documented, stable entry points that simply are not re-exported by the
# library's __init__.
reportPrivateImportUsage = "none"

# Unbound names are the highest-signal check in this repo - and "basic" leaves
# reportPossiblyUnboundVariable off, so turn it back on explicitly.
reportPossiblyUnboundVariable = "warning"

# None-safety is worth seeing. Enough fields here are declared `T | None` and
# populated lazily that these are advisory (yellow) rather than errors (red).
reportOptionalSubscript = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalOperand = "warning"
