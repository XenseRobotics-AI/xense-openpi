lr_schedule:
  type: CosineDecaySchedule
  warmup_steps: 1000
  peak_lr: 2.5e-5
  decay_steps: 30000
  decay_lr: 2.5e-6
model:
  type: Pi0FASTConfig
  action_dim: 8
  action_horizon: 10
data:
  type: DroidInferenceDataConfig
  assets:
    asset_id: droid
  base_config:
    tactile: false
    prompt_from_task: true
project_name: openpi
save_interval: 10000
keep_period: 10000
log_interval: 100
strict_batch_order: false
