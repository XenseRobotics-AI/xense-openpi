# Production launch (8xH100, hb-openpi env). Do not set XLA_FLAGS: the retired collective
# combining/pipelining flags corrupted FSDP gradients; see docs/training-optimization.md.
#   env -u LD_LIBRARY_PATH python scripts/check_cuda_stack.py
#   env -u LD_LIBRARY_PATH XLA_PYTHON_CLIENT_MEM_FRACTION=0.9 \
#   python scripts/train.py pi05_base_bi_flexiv_insert_ethernet_0928_h100 \
#     --exp-name=<experiment-name>
model:
  type: Pi0Config
  # Scanned 2026-09-04 over this dataset (4037 states incl. per-dim extremes): the longest
  # tokenized "Task: ..., State: ...;\nAction: " prompt
  # is 116 tokens, so 128 leaves 12 spare. Down from 200: -6.2% step time, identical loss
  # (padding tokens were masked anyway). Re-scan when the dataset or prompt changes.
  max_token_len: 128
  pi05: true
  discrete_state_input: true
  enable_training_time_rtc: false
  # Encode all three visual views in one SigLIP call.
  batch_image_views: true
weight_loader:
  type: CheckpointWeightLoader
  params_path: gs://openpi-assets/checkpoints/pi05_base/params
ema_decay: null
data:
  type: LeRobotBiFlexivDataConfig
  repo_id: Xense/insert-ethernet-above-desk-0916
  base_config:
    prompt_from_task: true
    tactile: false
  default_prompt: Pick up the RJ45 socket, then pick up the RJ45 plug, align the plug with the socket in the correct orientation, and insert the plug into the socket.
batch_size: 256
num_workers: 64
num_train_steps: 60000
# Whole-model grad/parameter norms are computed only on these logging steps.
log_interval: 100
save_interval: 10000
keep_period: 10000
fsdp_devices: 8
strict_batch_order: false
project_name: xense-openpi-hubo
