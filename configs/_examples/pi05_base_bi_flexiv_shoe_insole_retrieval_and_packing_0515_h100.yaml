lr_schedule:
  type: CosineDecaySchedule
  warmup_steps: 1000
  peak_lr: 2.5e-5
  decay_steps: 30000
  decay_lr: 2.5e-6
model:
  type: Pi0Config
  batch_image_views: true
  max_token_len: 200
  pi05: true
  discrete_state_input: true
  enable_training_time_rtc: true
weight_loader:
  type: CheckpointWeightLoader
  params_path: gs://openpi-assets/checkpoints/pi05_base/params
ema_decay: null
data:
  type: LeRobotBiFlexivDataConfig
  repo_id: Xense/shoe_insole_retrieval_and_packing0515
  base_config:
    tactile: false
    prompt_from_task: true
  default_prompt: Open the shoe tongue, take the insole out of the shoe, put the insole back into the shoe, and pack the shoe into the shoebox.
batch_size: 256
num_workers: 64
num_train_steps: 40000
fsdp_devices: 8
project_name: openpi
save_interval: 10000
keep_period: 10000
log_interval: 100
strict_batch_order: false
