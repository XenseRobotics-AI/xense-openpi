# Pi0.5 + FastViT-T12 tactile tokens + Latent Tactile Predictor (LTP).
#
# Step 2 of docs/action-conditioned-tactile-pretraining.md: the policy of
# pi05_base_bi_flexiv_bottle_sorting_0915_fastvit_h100 plus a training-only head
# that reads block m of the action expert at the 50 action-token positions and
# regresses the PCA-whitened frozen-FastViT latents of the tactile frames 10..50
# steps ahead. Loss = flow + lambda * tac, lambda = 1 after a 1k-step warm-up.
# Inference is bit-identical to the 0915 config.
#
# Before training:
#   1. Labels (one directory per dataset, ~1.4 GB for bottle-sorting):
#        python scripts/compute_tactile_future_labels.py \
#          --repo-id Xense/bottle-sorting-0810 \
#          --out assets/tactile_future_labels/bottle-sorting-0810
#   2. Pick m from the step-1 layer probes (RATG: 5-9 of 18). 6 below is a placeholder.

model:
  type: Pi0TactileFastVitConfig
  max_token_len: 200
  pi05: true
  discrete_state_input: true
  enable_training_time_rtc: false
  batch_image_views: true
  use_cudnn_attention: true
  cudnn_attention_dtype: float16
  # ---- tactile branch (same as 0915) ----
  tactile_encoder_name: fastvit_t12
  tactile_pretrained_path: ~/.cache/fastvit_t12_apple_dist_in1k_flax/params.safetensors
  tactile_compute_dtype: bfloat16
  # ---- LTP head ----
  # 1-based action-expert block whose output residual stream the head reads.
  tactile_future_layer: 6
  # 256 = PCA-whitened latent (data.tactile_future_target: latent); use 768 with
  # the pixel_delta control. tactile_future_horizons stays at its default
  # (10, 20, 30, 40, 50): overriding it here would make the config unhashable.
  tactile_future_dim: 256
  tactile_future_num_heads: 8
  tactile_future_head_dim: 128
  tactile_future_mlp_dim: 4096
  # "action": K/V are the 50 action positions only (main). "all": the read-out
  # control that may also copy the 4 tactile tokens.
  tactile_future_kv: action

weight_loader:
  type: CheckpointWeightLoader
  params_path: gs://openpi-assets/checkpoints/pi05_base/params
  # `.*tactile.*` also covers tactile_future_head/*, so a step-1 checkpoint (no
  # head) loads with the head freshly initialised.
  missing_regex: (.*lora.*)|(.*tactile.*)

ema_decay: null

data:
  type: LeRobotBiFlexivTactileDataConfig
  repo_id: Xense/bottle-sorting-0810
  base_config:
    prompt_from_task: true
    tactile: true
  default_prompt: Pick up the bottle, and place it in the far bin if it is heavy, or in the near bin if it is light.
  # Written by scripts/compute_tactile_future_labels.py (see header).
  tactile_future_labels_path: assets/tactile_future_labels/bottle-sorting-0810
  tactile_future_target: latent

lr_schedule:
  type: CosineDecaySchedule
  warmup_steps: 5000
  peak_lr: 2.5e-5
  decay_steps: 80000
  decay_lr: 2.5e-6

# Head at 4x the policy LR (1e-4 peak). Add ".*tactile_encoder.*": 0.1 for the
# step-1b "encoder at 0.1x" variant.
param_lr_scales:
  ".*tactile_future_head.*": 4.0

# lambda for L_tac, linear warm-up over the first 1k steps.
aux_loss_weight: 1.0
aux_loss_warmup_steps: 1000
# r_g = |grad tac| / |grad flow| over blocks 1..m on every log step (target 0.1-0.5).
log_aux_grad_ratio: true

batch_size: 256
num_workers: 64
num_train_steps: 80000
log_interval: 100
fsdp_devices: 8
save_interval: 10000
keep_period: 10000
strict_batch_order: false
