# JAX only: 6 action-expert steps, refresh action KV, 4 tactile-expert steps.
# Supply the converted FastViT checkpoint before starting training.
model:
  type: Pi0TactileExpertConfig
  pi05: true
  enable_training_time_rtc: false
  cascade_total_steps: 10
  cascade_split_step: 6
  tactile_expert_variant: gemma_300m
  tactile_loss_weight: 1.0
  tactile_dropout: 0.0
  tactile_encoder_name: fastvit_t12
  tactile_pretrained_path: ~/.cache/fastvit_t12_apple_dist_in1k_flax/params.safetensors
  tactile_compute_dtype: bfloat16
  batch_image_views: true
  use_cudnn_attention: true
  cudnn_attention_dtype: float16

weight_loader:
  type: CascadeInitWeightLoader
  params_path: gs://openpi-assets/checkpoints/pi05_base/params
  # This is a loader option: copy_action copies AFTER loading the checkpoint.
  tactile_expert_init: copy_action
  # Keep the loader's default missing_regex: covers tactile, *_tac and *_2.

ema_decay: null
data:
  type: LeRobotBiFlexivTactileDataConfig
  repo_id: Xense/insert-test-tube-0919
  base_config:
    prompt_from_task: true
    tactile: true
  default_prompt: Grasp the test tube, adjust it, and insert it.

lr_schedule:
  type: CosineDecaySchedule
  warmup_steps: 1000
  peak_lr: 2.5e-5
  decay_steps: 60000
  decay_lr: 2.5e-6

# Global batch size; tune for available device memory.
batch_size: 256
num_workers: 64
num_train_steps: 60000
fsdp_devices: 8
save_interval: 10000
keep_period: 10000
strict_batch_order: false
