# Left-wrist black-image ablation for the test-tube task.
# Launch on the target training server in its OpenPI environment:
#   python scripts/train.py pi05_base_bi_flexiv_insert_test_tube_1009_h100 \
#     --exp-name=1009_left_wrist_black
model:
  type: Pi0Config
  max_token_len: 128
  pi05: true
  discrete_state_input: true
  enable_training_time_rtc: false
  # Encode all three visual views in one SigLIP call.
  batch_image_views: true
  # Enable the FP16 cuDNN custom VJP on the target training server.
  use_cudnn_attention: true
  cudnn_attention_dtype: float16
weight_loader:
  type: CheckpointWeightLoader
  params_path: gs://openpi-assets/checkpoints/pi05_base/params
ema_decay: null
data:
  type: LeRobotBiFlexivDataConfig
  # Left-wrist camera ablation; head and right wrist remain unchanged.
  black_left_wrist: true
  repo_id: Xense/insert-test-tube-0919
  base_config:
    prompt_from_task: true
    tactile: false
  default_prompt: Grasp the test tube, adjust it, and insert it.
batch_size: 256
num_workers: 64
num_train_steps: 60000
# Whole-model grad/parameter norms are computed only on these logging steps.
log_interval: 100
save_interval: 10000
keep_period: 10000
fsdp_devices: 8
strict_batch_order: false
