# Launch template (8xH100, hb-openpi env). Do not set XLA_FLAGS: the retired collective
# combining/pipelining flags corrupted FSDP gradients; see docs/training-optimization.md.
#   python scripts/compute_norm_stats.py --config-name pi05_base_bi_elite_egg_carton_to_tray_1012_h100
#   env -u LD_LIBRARY_PATH python scripts/check_cuda_stack.py
#   env -u LD_LIBRARY_PATH XLA_PYTHON_CLIENT_MEM_FRACTION=0.9 \
#   python scripts/train.py pi05_base_bi_elite_egg_carton_to_tray_1012_h100 \
#     --exp-name=<experiment-name>
lr_schedule:
  type: CosineDecaySchedule
  warmup_steps: 1000
  peak_lr: 2.5e-5
  decay_steps: 30000
  decay_lr: 2.5e-6
model:
  type: Pi0Config
  # Same 20D state and a shorter prompt than the Flexiv 0904 dataset scanned at 116
  # tokens; not scanned on this dataset. Re-scan if the prompt changes.
  max_token_len: 128
  pi05: true
  discrete_state_input: true
  enable_training_time_rtc: false
  # Encode all three visual views in one SigLIP call.
  batch_image_views: true
weight_loader:
  type: CheckpointWeightLoader
  params_path: gs://openpi-assets/checkpoints/pi05_base/params
ema_decay: null
data:
  type: LeRobotBiEliteDataConfig
  # Uses the local LeRobot cache under ~/.cache/huggingface/lerobot/.
  # Recorded on bench diagonal-08 with taccap grippers and native_assembly: diagonal-08;
  # serve with examples/bi_elite_cs66_rt/recipes/diagonal-08-taccap.yaml.
  repo_id: Xense/bi_elite_cs66_rt_egg_carton_to_tray_1016
  use_delta_cartesian_actions: true
  base_config:
    prompt_from_task: true
    # The four tactile streams are not consumed by this policy.
    tactile: false
  default_prompt: Open the egg carton, then take out the eggs one by one and place them in the egg tray.
batch_size: 256
num_workers: 64
# 25 episodes / 80.6k frames: 30k steps at batch 256 is ~95 epochs. Matches the default
# cosine decay_steps (30k), so no step runs on the LR floor. Earlier checkpoints are kept
# in case the later ones overfit.
num_train_steps: 30000
# Whole-model grad/parameter norms are computed only on these logging steps.
log_interval: 100
save_interval: 5000
keep_period: 5000
fsdp_devices: 8
strict_batch_order: false
project_name: xense-openpi-hubo
