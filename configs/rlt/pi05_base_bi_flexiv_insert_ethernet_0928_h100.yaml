# RLT phase one (prefix precompute + RL-token encoder-decoder training) for the
# insert_ethernet_0928 SFT policy. Usage:
#
#   mamba activate lerobot-xense
#   python scripts/rlt/precompute_prefix.py pi05_base_bi_flexiv_insert_ethernet_0928_h100
#   python scripts/rlt/train_token.py pi05_base_bi_flexiv_insert_ethernet_0928_h100 --exp-name <run>
#
# The VLA config sets max_token_len=128 (longest prompt on this dataset is 116),
# so the prefix is 3 * 256 image tokens + 128 prompt tokens = 896.

project_name: xense-openpi-hubo

model:
  embed_dim: 2048
  prefix_seq_len: 896 # 3 cameras * 256 image tokens + max_token_len 128 from the VLA config
  num_layers: 2
  num_heads: 8
  mlp_ratio: 4.0
  dtype: bfloat16
  remat: false

token_training:
  vla_config: pi05_base_bi_flexiv_insert_ethernet_0928_h100
  # SFT checkpoint selected by the policy-server launch command on xense-inference.
  vla_checkpoint: /home/li/hubo/xense-openpi/checkpoints/ehernet_insertion
  prefix_cache_dir: /data/rlt_cache/insert_ethernet_0928 # ~3.6 MB per cached frame; use fast local disk
  repo_id: null # inherits Xense/insert-ethernet-above-desk-0916 from the VLA config
  frame_stride: 1

  batch_size: 256 # global, split across all local GPUs
  num_train_steps: 20000
  peak_lr: 1.0e-4 # AdamW(0.9, 0.95) + grad-norm clip 1.0, warmup then cosine decay to min_lr
  min_lr: 2.5e-5
  warmup_steps: 1000
  num_workers: 8
  fsdp_devices: 1

  checkpoint_base_dir: ./checkpoints_rlt # run dir: <base>/<config name>/<exp-name>/token/<step>
  save_interval: 1000
  keep_period: 5000
  log_interval: 50

# Phase two: fixed-weight chunked-TD actor-critic
# Fixed network structure and other settings use RLConfig defaults.
rl:
  token_checkpoint: /home/li/hubo/xense-openpi/checkpoints/ehernet_insertion/token_encoder/60000 # phase-one token step dir
  num_action_chunks: 20 # C: executed steps per chunk and TD bootstrap horizon
  ref_num_action_chunks: 50 # VLA reference length; the actor consumes the first C steps

  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  gamma: 0.99 # per execution step; bootstrap discount is gamma**C
  q_weight: 0.1 # actor loss: -q_weight * Q1 + bc_weight * BC
  bc_weight: 5.0 # fixed weights; no weight schedule or smoothness penalty
  input_reference: corrected # proposal: raw VLA reference as actor training input
  reference_dropout_prob: 0.5
  fixed_std: 0.002 # Gaussian exploration in normalized action space

  # Q gate: metrics are logged every round regardless; with enable: true the critic steers
  # the actor (q_weight leaves warmup) only after it ranks human corrections above the VLA
  # proposal on recent windows, sustained over sustain_evals evaluations. Hysteresis: any
  # metric below its close_* threshold close_evals times in a row drops back to warmup.
  q_gate:
    enable: true
    warmup_bc_weight: 7.0
    warmup_q_weight: 0.05
    online_bc_weight: 2.5
    online_q_weight: 0.45
    ramp_updates: 200 # actor updates from warmup to online weights after the gate opens
    eval_windows: 64 # windows sampled per class (intervened / clean) per evaluation
    recent_rounds: 5 # prefer windows from the latest rounds; falls back to all
    min_windows: 8 # fewer windows per class -> the evaluation is skipped
    min_success_windows: 20 # reward-signal prerequisite
    min_rank_accuracy: 0.8 # open: Q(human-corrected) > Q(VLA proposal) fraction
    min_margin_std: 0.5 # open: median Q difference / batch Q std
    min_clean_accuracy: 0.9 # open: Q(executed) > Q(random) on clean windows
    sustain_evals: 3
    close_rank_accuracy: 0.6
    close_margin_std: 0.2
    close_clean_accuracy: 0.7
    close_evals: 2

  batch_size: 256
  buffer_size: 6000 # replay transitions, not executed steps
  replay_stride: 2 # sliding anchors every 2 execution steps; must divide C
  # At 30 executed steps/s, a 4-5 s labeled phase yields 56-71 overlapping rows
  # (C=10, stride=2): 600 rows correspond to about 9-11 phases.
  warm_up: 600 # replay rows before training and actor execution in open windows
  utd: 5 # critic updates per committed row; spend the full backlog at round end

  total_rounds: 300
  listen: 0.0.0.0:8000 # server listens; the robot host connects
