# RLT (prefix precompute + RL-token encoder-decoder training + online RL) for the
# insert_ethernet_0928 SFT policy. Usage:
#
#   mamba activate lerobot-xense
#   python scripts/rlt/precompute_prefix.py pi05_base_bi_flexiv_insert_ethernet_0928_h100
#   python scripts/rlt/train_token.py pi05_base_bi_flexiv_insert_ethernet_0928_h100 --exp-name <run>
#   python scripts/rlt/train_rl.py pi05_base_bi_flexiv_insert_ethernet_0928_h100 --exp-name <run>
#
# The VLA config sets max_token_len=128 (longest prompt on this dataset is 116),
# so the prefix is 3 * 256 image tokens + 128 prompt tokens = 896.

project_name: xense-openpi-hubo

model:
  embed_dim: 2048
  prefix_seq_len: 896 # 3 cameras * 256 image tokens + max_token_len 128 from the VLA config
  num_layers: 2
  num_heads: 8
  mlp_ratio: 4.0
  dtype: bfloat16
  remat: false

token_training:
  vla_config: pi05_base_bi_flexiv_insert_ethernet_0928_h100
  # TODO: point at the actual SFT run's orbax step dir (params/ + assets/);
  # the VLA config trains 60000 steps, so the final step dir is 59999.
  vla_checkpoint: ./checkpoints/pi05_base_bi_flexiv_insert_ethernet_0928_h100/<exp-name>/59999
  prefix_cache_dir: /data/rlt_cache/insert_ethernet_0928 # ~3.6 MB per cached frame; use fast local disk
  repo_id: null # inherits Xense/insert-ethernet-above-desk-0916 from the VLA config
  frame_stride: 1

  batch_size: 256 # global, split across all local GPUs
  num_train_steps: 20000
  peak_lr: 1.0e-4 # AdamW(0.9, 0.95) + grad-norm clip 1.0, warmup then cosine decay to min_lr
  min_lr: 2.5e-5
  warmup_steps: 1000
  num_workers: 8
  fsdp_devices: 1

  checkpoint_base_dir: ./checkpoints_rlt # run dir: <base>/<config name>/<exp-name>/token/<step>
  save_interval: 1000
  keep_period: 5000
  log_interval: 50

# Phase two: online RL on the real robot (scripts/rlt/train_rl.py). Defaults are TacXense's
# tuned real-robot values. The robot host runs examples/bi_flexiv_rizon4_rt/main.py --args.rlt.
rl:
  num_action_chunks: 20 # C: executed steps per transition and TD bootstrap horizon
  ref_num_action_chunks: 50 # VLA reference length fed to the actor (first C steps used); VLA horizon is 50
  actor_hidden_dims: [256, 256]
  critic_hidden_dims: [256, 256]
  num_q_heads: 2
  actor_layer_norm: false
  critic_layer_norm: true
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  max_grad_norm: 10.0 # per network
  gamma: 0.99 # per step; bootstrap discount gamma**C
  tau: 0.005 # target critic soft update, every critic step
  q_weight: 0.1 # actor: -q_weight * Q1 + bc_weight * BC
  bc_weight: 5.0
  reference_dropout_prob: 0.5
  fixed_std: 0.002 # Gaussian actor exploration std (normalized space)
  critic_actor_ratio: 2 # actor updates after every 2nd critic update
  # Smoothness penalty on the actor's normalized chunk (velocity/acceleration/jerk);
  # TacXense's insert_ethernet_0917 real-robot config used 0.003.
  smooth_weight: 0.003
  smooth_order_weights: [1.0, 1.0, 1.0]
  # BC/Q weights per actor update: warm-up weights, then a linear ramp to the online weights.
  # Disabled: q_weight/bc_weight above apply throughout.
  actor_weight_schedule:
    enable: false
    warmup_updates: 0
    ramp_updates: 0
    warmup_bc_weight: 7.0
    warmup_q_weight: 0.05
    online_bc_weight: 2.5
    online_q_weight: 0.45
  batch_size: 256
  buffer_size: 6000 # transitions
  replay_stride: 2 # labeled phases -> C-step windows every 2 env steps; must divide C
  warm_up: 250 # transitions before training starts and the actor drives open windows
  utd: 5 # critic updates per committed transition
  token_checkpoint: null # phase-one step dir or token/ run dir; null = this run's token/
  total_rounds: 300
  listen: 0.0.0.0:8000 # the robot host dials this address
  num_steps: 10 # VLA denoising steps for the reference
  replay_feature_batch_size: 16 # VLA batch when a labeled phase computes window features
  takeover_position_m: 0.005 # a held grip takes over once a controller moves this far...
  takeover_rotation_deg: 3.0 # ...or rotates this much
  save_interval: 10 # rounds between checkpoints (weights, optimizers, replay)
  keep_period: 50 # older checkpoints are pruned except rounds divisible by this (null: latest only)
  dump_transitions: true # per-round transitions + events.jsonl under <run>/transitions (analysis only)
