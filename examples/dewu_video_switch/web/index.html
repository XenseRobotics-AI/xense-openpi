<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>dewu video switch</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  /* Every clip is preloaded and playing (standby is frozen on frame 0). A switch
     is an INSTANT, seamless cut — no cross-dissolve: the incoming clip is raised
     above the others and shown at full opacity in a single frame. The outgoing
     clip stays opaque underneath until that instant, so the composite is opaque
     throughout and there is no flash, dip, or fade. */
  video {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
    opacity: 0;
  }
  #status {
    position: fixed; left: 8px; bottom: 6px;
    font: 12px/1.4 monospace; color: #6f6; opacity: .5;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="status">connecting…</div>

<script>
// ---- Config: scene id -> video file (under web/videos/). -------------------
// Scene ids from the detector (shoe_state_machine._level()):
//   standby                     — idle: shows the 1-1 clip frozen on its first frame
//   "1-1"/"2-1"  (detecting)    — after pick, white(1)/red(2) shoe: play that clip
//   "1-2"/"2-2"  (after blue)   — after the blue insole is seen: play that clip
// Flow: standby -> 1-1 -> 1-2 -> 2-1 -> 2-2 -> 1-1 -> 1-2 -> 2-1 -> 2-2 -> standby.
// videos/<scene>.mp4 are symlinks to the real product clips (dewu-whiteshoes-*,
// dewu-red-shoes-*) — swap the symlink target to change a clip, not this file.
const SCENES = {
  standby: "videos/1-1.mp4",   // white shoe clip, frozen on frame 0
  "1-1":   "videos/1-1.mp4",   // shoe 1/3 (white) detecting
  "1-2":   "videos/1-2.mp4",   // shoe 1/3 (white) after blue insole
  "2-1":   "videos/2-1.mp4",   // shoe 2/4 (red) detecting
  "2-2":   "videos/2-2.mp4",   // shoe 2/4 (red) after blue insole
};
const DEFAULT_SCENE = "standby";
// Front-end ws is served by app.py on switch-port (default 9101) on this host.
const SWITCH_WS = `ws://${location.hostname}:9101`;
// ----------------------------------------------------------------------------

const stage = document.getElementById("stage");
const statusEl = document.getElementById("status");
const els = {};        // scene id -> <video>
let activeScene = null;
let zTop = 0;          // running z-index so each switch lands on top

// Preload every clip muted and PARK it decoded on a paused frame 0. A switch is then a
// pure reveal — play() from an already-decoded frame — with NO seek at show time. (A
// seek at show time is exactly what caused the switch flash: the clip was revealed on
// its stale last-played frame, then jumped to frame 0 as the async seek landed a moment
// later.) Muted autoplay/seek is allowed without a gesture on Chrome & Safari.
for (const [scene, src] of Object.entries(SCENES)) {
  const v = document.createElement("video");
  v.src = src;
  v.muted = true;
  v.playsInline = true;
  v.preload = "auto";
  // No looping: an active clip that finishes before its switch signal HOLDS on its last
  // frame (HTML video stays on the final frame when it ends) and waits — so a slow robot
  // never makes the video auto-advance.
  v.loop = false;
  stage.appendChild(v);
  els[scene] = v;
  // Park on a decoded frame 0, paused — ready for an instant, flash-free reveal.
  v.addEventListener("loadeddata", () => { try { v.pause(); v.currentTime = 0; } catch (e) {} }, { once: true });
}

function show(scene) {
  if (!(scene in els)) { console.warn("unknown scene", scene); return; }
  if (scene === activeScene) return;
  const prev = activeScene ? els[activeScene] : null;
  const v = els[scene];

  // The incoming clip is already sitting on a decoded frame 0 (preloaded, or rewound
  // when it was last switched away from), so this is a pure reveal in a single paint:
  // no seek, no black frame, no jump. Raise it above everything at full opacity; the
  // outgoing clip stays opaque underneath until this instant, so the composite never
  // goes transparent (no dip/fade either).
  v.style.zIndex = String(++zTop);
  v.style.opacity = "1";
  if (scene === "standby") {
    try { v.pause(); v.currentTime = 0; } catch (e) {}   // idle: hold frame 0
  } else {
    const p = v.play();
    if (p) p.catch(() => {  // shown before it finished loading -> play as soon as it can
      v.addEventListener("canplay", () => { if (activeScene === scene) v.play().catch(() => {}); }, { once: true });
    });
  }

  activeScene = scene;
  statusEl.textContent = "scene: " + scene;

  // Rewind the outgoing clip to a decoded frame 0 for its next reuse (scenes repeat:
  // 1-1 / 2-1 show again for shoes 3 / 4). It is now fully hidden behind the incoming
  // clip, so this seek is invisible on screen — the flash only ever happened because
  // the rewind used to run on the clip WHILE it was becoming visible.
  if (prev && prev !== v) {
    try { prev.pause(); prev.currentTime = 0; } catch (e) {}
  }
}

show(DEFAULT_SCENE);

// ---- Front-end websocket with auto-reconnect -------------------------------
function connect() {
  statusEl.textContent = "connecting…";
  let ws;
  try { ws = new WebSocket(SWITCH_WS); }
  catch (e) { return setTimeout(connect, 1000); }

  ws.onopen = () => { statusEl.textContent = "connected"; };
  ws.onmessage = (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg && msg.scene) show(msg.scene);
    } catch (e) { /* ignore malformed */ }
  };
  ws.onclose = () => { statusEl.textContent = "disconnected — retrying"; setTimeout(connect, 1000); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}
connect();
</script>
</body>
</html>
