# Inference recipe — bimanual Flexiv Rizon4 RT, diagonal mount, bench 02.
#   python -m examples.bi_flexiv_rizon4_rt.main --args.robot-recipe diagonal-02 ...
#
# Bench hardware only; run tuning stays on the CLI (see recipes/README.md).
# Hardware transcribed from lerobot-xense
# recipes/teleop/bi_flexiv_rizon4_rt/diagonal-02.yaml — keep the two in sync.

robot:
  type: bi_flexiv_rizon4_rt

  # ── Bench hardware (diagonal-02) ────────────────────────────────────────────
  left_robot_sn: Rizon4-063423
  right_robot_sn: Rizon4-062855
  # Joint angles in DEGREES (J1..J7), the units flexiv_rt takes.
  left_start_position_degree: [16.18, -26.29, -3.84, 114.0, 10.66, 84.24, 27.56]
  right_start_position_degree: [31.91, -26.72, -27.42, 122.58, -13.93, 89.42, -1.31]
  left_home_position_degree: [16.18, -26.29, -3.84, 114.0, 10.66, 84.24, 27.56]
  right_home_position_degree: [31.91, -26.72, -27.42, 122.58, -13.93, 89.42, -1.31]

  # ── Cameras ─────────────────────────────────────────────────────────────────
  # Only the head is pinned: the taccap gripper sniffs its own wrist + GSPS
  # tactile cameras off its USB hub at connect (gripper.auto_discover_cameras).
  cameras:
    head:
      type: intelrealsense
      serial_number_or_name: "135522074323"
      fps: 30
      width: 640
      height: 480
      warmup_s: 1
      use_depth: false

  # ── Gripper ── One block for both arms; `side` is stamped per arm at build time.
  # Both grippers -> xense.taccap FollowerGripper (matched pair, single switch).
  gripper:
    type: taccap_follower
    kp: 8.0                 # MIT impedance stiffness (Nm/rad)
    kd: 1.0                 # MIT impedance damping (Nm·s/rad)
    # ⚠️ HIGH GRIP FORCE — constant closing feed-forward torque. NEGATIVE = clamp.
    # -3.0 Nm is ~10x the SDK gentle-grasp abort (0.30 Nm) and near the motor's
    # ceiling: it is a hard crush. Being a CONSTANT bias, the jaw also settles
    # ~3/kp≈0.375 rad short of full open and holds the closed stop under load even
    # empty (runs hot). Back off toward -0.3 if it stalls / can't open / overheats.
    feedforward_torque: -3.0    # Nm, negative = closing
    control_hz: 200             # ControlLoop resubmit rate
    auto_discover_cameras: true
    require_calibrated: true
    init_open: true
    # Everything else worth tuning, at its default — uncomment to change.
    # side: left        # stamped automatically per arm — do not set here
    # mcu_device: null  # explicit MCU path; the arm fills this from discovery
  left_use_gripper: true
  right_use_gripper: true
