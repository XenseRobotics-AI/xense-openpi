# Inference recipe — bimanual Flexiv Rizon4 RT, forward mount, bench 05.
#   python -m examples.bi_flexiv_rizon4_rt.main --args.robot-recipe forward-05 ...
#
# Bench hardware only; run tuning stays on the CLI (see recipes/README.md).
# Hardware transcribed from lerobot-xense
# recipes/teleop/bi_flexiv_rizon4_rt/forward-05.yaml — keep the two in sync.
#
# ⚠️ THE GRIPPER BACKEND IS INHERITED, NOT VERIFIED. Upstream's forward-05 recipe
# carries the same warning: it runs `serial` because the retired station file's
# camera list implied it, but nothing confirms what is bolted to this bench. If
# it actually has TacCap followers, connect() hangs scanning /dev/ttyACM* for
# serial gripper boards that aren't there — switch to the taccap block from
# forward-01.yaml.

robot:
  type: bi_flexiv_rizon4_rt

  # ── Bench hardware (forward-05) ─────────────────────────────────────────────
  left_robot_sn: Rizon4-063786
  right_robot_sn: Rizon4R-062096
  # Joint angles in DEGREES (J1..J7), the units flexiv_rt takes.
  left_start_position_degree: [96.59, 65.45, -6.65, 78.76, 85.09, -5.48, -103.47]
  right_start_position_degree: [96.93, 65.4, -7.06, 78.87, 85.03, -5.68, -103.2]
  left_home_position_degree: [96.59, 65.45, -6.65, 78.76, 85.09, -5.48, -103.47]
  right_home_position_degree: [96.93, 65.4, -7.06, 78.87, 85.03, -5.68, -103.2]

  # ── Cameras ─────────────────────────────────────────────────────────────────
  # Only the head is pinned: the gripper sniffs its own wrist + tactile cameras
  # off its USB hub at connect (gripper.auto_discover_cameras).
  cameras:
    head:
      type: intelrealsense
      serial_number_or_name: "346522071766"
      fps: 30
      width: 640
      height: 480
      warmup_s: 1
      use_depth: false
    # What this bench had pinned before discovery took over, for cross-checking
    # the first run:
    #   left_tactile_0: OG001359    left_tactile_1: OG001360   left_wrist: XC000047
    #   right_tactile_0: OG001369   right_tactile_1: OG001370  right_wrist: XC000054

  # ── Gripper ── One block for both arms; `side` is stamped per arm at build time.
  gripper:
    type: serial
    gripper_v_max: 100.0    # mm/s
    gripper_f_max: 40.0     # N
    gripper_min_pos: 0.0    # mm — fully closed
    gripper_max_pos: 85.0   # mm — fully open
    serial_timeout: 1.0
    init_open: true
    # Everything else worth tuning, at its default — uncomment to change.
    # auto_discover_cameras: true   # sniff wrist + tactile off this gripper's USB hub
    # port: ""                      # explicit /dev path; overrides sn + side
    # sn: null                      # board SN; scanned across ports when port unset
    # side: null                    # stamped automatically per arm — do not set here
  left_use_gripper: true
  right_use_gripper: true
