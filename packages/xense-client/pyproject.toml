[project]
name = "xense-client"
version = "0.2.0"
# The code already uses 3.10+ syntax (`X | None` annotations) with no
# `from __future__ import annotations` anywhere, and the repo that vendors this
# package requires >=3.12. The old ">=3.7" was never true.
requires-python = ">=3.12"
dependencies = [
    "dm-tree>=0.1.8",
    "msgpack>=1.0.5",
    "numpy>=1.22.4",
    "pillow>=9.0.0",
    "tree>=0.2.4",
    "websockets>=11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tests live next to the code they cover (the repo-wide convention), which means
# hatchling's auto-discovery would otherwise ship them to every installing user.
[tool.hatch.build.targets.wheel]
exclude = ["**/*_test.py", "**/conftest.py"]

[tool.hatch.build.targets.sdist]
exclude = ["**/*_test.py", "**/conftest.py"]

[tool.uv]
dev-dependencies = ["pytest>=8.3.4"]

# Without this, ruff stops at the nearest pyproject.toml with a [tool.ruff]
# table - this one - and lints the client against its *default* rule set rather
# than the repo's. Extending the root keeps one ruleset for the whole tree.
[tool.ruff]
extend = "../../pyproject.toml"
line-length = 120
target-version = "py312"
